name: V2/V3 Flower Bot Tests

on:
  push:
    branches:
      - v2-smart
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-v2-v3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run all flower engine tests
        working-directory: v2
        run: |
          python -m pytest -v

      - name: Compile flower bot files
        run: |
          python -m py_compile v2/flower_engine_v2.py
          python -m py_compile v2/flower_engine_pt_south.py
          python -m py_compile v2/flower_engine_v3.py
          python -m py_compile v2/main_v2.py
          python -m py_compile main.py
